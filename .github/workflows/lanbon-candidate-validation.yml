name: LANBON candidate Linux validation
on:
  push:
    branches: ['codex/lanbon-validation-20260921']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Core real integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feedad55bd4b7ed01d510602e43dbd22fa39493e
          persist-credentials: false
      - name: Apply switch-only candidate
        env:
          CANDIDATE: ''
          CANDIDATE_SHA256: '8cb7c020035565c41ce17267b1354bbd1f2d7998c64b3117a07f1c99f602c251'
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(os.environ['CANDIDATE']))
          assert hashlib.sha256(raw).hexdigest() == os.environ['CANDIDATE_SHA256']
          for name, content in json.loads(raw).items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          PY
          git add homeassistant/components/lanbon tests/components/lanbon
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bluez ffmpeg libturbojpeg libxml2-utils libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libudev-dev
          python3 -m pip install uv
          uv python install 3.14.5
      - name: Set up Core using its development script
        id: setup
        run: script/setup
      - name: Install published dependency and regenerate requirements
        if: steps.setup.outcome == 'success'
        run: |
          uv pip install --python .venv/bin/python 'aiolanbon==0.2.1'
          uv run --no-sync python -c "from importlib.metadata import version; assert version('aiolanbon') == '0.2.1'"
          uv run --no-sync python -m script.gen_requirements_all
      - name: Generate LANBON translations
        if: steps.setup.outcome == 'success'
        run: .venv/bin/python -m script.translations develop --integration lanbon
      - name: Prove regression tests fail on the previous candidate
        if: steps.setup.outcome == 'success'
        env:
          PREVIOUS_COORDINATOR: ''
        run: |
          cp homeassistant/components/lanbon/coordinator.py /tmp/lanbon-fixed-coordinator.py
          trap 'cp /tmp/lanbon-fixed-coordinator.py homeassistant/components/lanbon/coordinator.py' EXIT
          python -c "import os,base64,pathlib; pathlib.Path('homeassistant/components/lanbon/coordinator.py').write_bytes(base64.b64decode(os.environ['PREVIOUS_COORDINATOR']))"
          set +e
          uv run --no-sync pytest -q --timeout=30 tests/components/lanbon/test_coordinator.py -k 'concurrent_event_requires_complete_snapshot or reconnect_waits_for_actual_snapshot' --junitxml=/tmp/lanbon-before.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/lanbon-before.xml').getroot()
          failures = root.findall('.//testcase/failure')
          assert len(failures) == 2, ET.tostring(root).decode()
          assert not root.findall('.//testcase/error'), ET.tostring(root).decode()
          print('Both new regressions fail on the previous candidate as expected')
          PY
      - name: Prove polling recovery fails on the previous candidate
        if: steps.setup.outcome == 'success'
        env:
          PREVIOUS_COORDINATOR: ''
        run: |
          cp homeassistant/components/lanbon/coordinator.py /tmp/lanbon-fixed-coordinator.py
          trap 'cp /tmp/lanbon-fixed-coordinator.py homeassistant/components/lanbon/coordinator.py' EXIT
          python -c "import os,base64,pathlib; pathlib.Path('homeassistant/components/lanbon/coordinator.py').write_bytes(base64.b64decode(os.environ['PREVIOUS_COORDINATOR']))"
          set +e
          uv run --no-sync pytest -q --timeout=30 tests/components/lanbon/test_coordinator.py -k 'events_do_not_postpone_snapshot_recovery or partial_event_preserves_poll_failure_until_recovery' --junitxml=/tmp/lanbon-before.xml
          result=$?
          set -e
          test "$result" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/lanbon-before.xml').getroot()
          failures = root.findall('.//testcase/failure')
          assert len(failures) == 3, ET.tostring(root).decode()
          assert not root.findall('.//testcase/error'), ET.tostring(root).decode()
          print('All three polling regressions fail on the previous candidate as expected')
          PY
      - name: Run real Core pytest and coverage
        if: steps.setup.outcome == 'success'
        run: uv run --no-sync pytest -q --timeout=60 tests/components/lanbon --cov=homeassistant.components.lanbon --cov-report=term-missing --cov-report=xml:lanbon-coverage.xml
      - name: Validate integration metadata
        if: always() && steps.setup.outcome == 'success'
        run: uv run --no-sync python -m script.hassfest --integration-path homeassistant/components/lanbon
      - name: Validate generated requirements
        if: always() && steps.setup.outcome == 'success'
        run: .venv/bin/python -m script.gen_requirements_all validate
      - name: Type-check LANBON source
        if: always() && steps.setup.outcome == 'success'
        run: uv run --no-sync mypy homeassistant/components/lanbon
      - name: Lint LANBON source and tests
        if: always() && steps.setup.outcome == 'success'
        run: uv run --no-sync pylint --ignore-missing-annotations=y homeassistant/components/lanbon tests/components/lanbon
      - name: Check candidate formatting
        if: always() && steps.setup.outcome == 'success'
        run: |
          uv run --no-sync ruff check homeassistant/components/lanbon tests/components/lanbon
          uv run --no-sync ruff format --check homeassistant/components/lanbon tests/components/lanbon
      - name: Preserve candidate diff
        if: always()
        run: git diff HEAD -- homeassistant/components/lanbon tests/components/lanbon requirements_all.txt requirements_test_all.txt > lanbon-candidate.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lanbon-candidate-validation
          path: |
            lanbon-candidate.patch
            lanbon-coverage.xml
