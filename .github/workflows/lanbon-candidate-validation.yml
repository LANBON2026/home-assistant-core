name: LANBON candidate Linux validation
on:
  push:
    branches: ['codex/lanbon-validation-20260921']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Current Core compatibility validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: home-assistant/core
          ref: ac31795d136407be6d96df840c50472eb78e6680
          persist-credentials: false
      - name: Apply current Core schema compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('homeassistant/components/lanbon/config_flow.py')
          source = path.read_text()
          assert 'import voluptuous as vol' in source
          path.write_text(source.replace('import voluptuous as vol', 'import probatio').replace('vol.Schema(', 'probatio.Schema(').replace('vol.Required(', 'probatio.Required('))
          PY
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bluez ffmpeg libturbojpeg libxml2-utils libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libudev-dev
          python3 -m pip install uv
          uv python install 3.14.5
      - name: Set up Core using its development script
        id: setup
        run: script/setup
      - name: Install published dependency and regenerate requirements
        if: steps.setup.outcome == 'success'
        run: |
          uv pip install --python .venv/bin/python 'aiolanbon==0.2.1'
          uv run --no-sync python -c "from importlib.metadata import version; assert version('aiolanbon') == '0.2.1'"
          uv run --no-sync python -m script.gen_requirements_all
      - name: Generate LANBON translations
        if: steps.setup.outcome == 'success'
        run: .venv/bin/python -m script.translations develop --integration lanbon
      - name: Regenerate full integration metadata
        if: steps.setup.outcome == 'success'
        run: uv run --no-sync python -m script.hassfest
      - name: Run real Core pytest and coverage
        if: steps.setup.outcome == 'success'
        run: uv run --no-sync pytest -q --timeout=60 tests/components/lanbon --cov=homeassistant.components.lanbon --cov-report=term-missing --cov-report=xml:lanbon-coverage.xml
      - name: Validate full integration metadata
        if: always() && steps.setup.outcome == 'success'
        run: uv run --no-sync python -m script.hassfest --action validate
      - name: Validate generated requirements
        if: always() && steps.setup.outcome == 'success'
        run: .venv/bin/python -m script.gen_requirements_all validate
      - name: Type-check LANBON source
        if: always() && steps.setup.outcome == 'success'
        run: uv run --no-sync mypy homeassistant/components/lanbon
      - name: Lint LANBON source and tests
        if: always() && steps.setup.outcome == 'success'
        run: uv run --no-sync pylint --ignore-missing-annotations=y homeassistant/components/lanbon tests/components/lanbon
      - name: Run full prek checks
        if: always() && steps.setup.outcome == 'success'
        env:
          PREK_SKIP: no-commit-to-branch,mypy,pylint,gen_requirements_all,hassfest,hassfest-metadata,hassfest-mypy-config,zizmor
        run: uv run --no-sync prek run --all-files
      - name: Preserve exact compatibility diff
        if: always()
        run: git diff HEAD > lanbon-current-core.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lanbon-current-core-validation
          path: |
            lanbon-current-core.patch
            lanbon-coverage.xml
            homeassistant/generated/integrations.json
            homeassistant/components/lanbon/config_flow.py
